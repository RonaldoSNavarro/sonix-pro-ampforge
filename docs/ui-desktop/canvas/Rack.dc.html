<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rack — equipamentos de estúdio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Oswald:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.osw{font-family:Oswald,'Arial Narrow',sans-serif}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.knob{position:relative;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;flex:none}
.knob:focus-visible{box-shadow:0 0 0 3px #3dd8ff}
.knob .sh{position:absolute;inset:0;border-radius:50%;box-shadow:0 6px 9px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.8)}
.knob .rotor{position:absolute;inset:0;border-radius:50%}
.knob .a,.knob .b,.knob .p{position:absolute;display:block}
.r-big .rotor{background:radial-gradient(circle at 40% 30%,#3a3a3a,#0b0b0b 70%);box-shadow:inset 0 0 0 3px #9a9fa5,inset 0 0 0 4px #222}
.r-big .a{inset:20%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#454545,#0d0d0d 75%)}
.r-big .p{left:50%;top:6%;width:3px;height:30%;margin-left:-1.5px;background:#f4f4f4}
.r-small .rotor{background:repeating-conic-gradient(#121212 0 7deg,#2a2a2a 7deg 14deg)}
.r-small .a{inset:16%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#3d3d3d,#0d0d0d 75%)}
.r-small .p{left:50%;top:6%;width:2px;height:32%;margin-left:-1px;background:#f4f4f4}
.r-chick .a{inset:16%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#4a4a4a,#0d0d0d 70%)}
.r-chick .b{left:33%;right:33%;top:-8%;bottom:34%;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:linear-gradient(90deg,#0d0d0d,#3d3d3d 45%,#0d0d0d)}
.r-chick .p{left:50%;top:-4%;width:2px;height:34%;margin-left:-1px;background:#f0f0f0}
.r-alu .rotor{background:repeating-conic-gradient(#b8bdc2 0 6deg,#e7eaed 6deg 12deg);box-shadow:inset 0 0 0 1px #6b7076}
.r-alu .a{inset:18%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffffff,#c4c9ce 60%,#8a9096)}
.r-alu .p{left:50%;top:6%;width:2px;height:30%;margin-left:-1px;background:#1a1a1a}
.ear{position:absolute;top:0;bottom:0;width:22px;background:linear-gradient(90deg,#9aa0a6,#d9dde1 40%,#8d9399)}
.hole{position:absolute;left:5px;width:12px;height:7px;border-radius:4px;background:#0a0a0a;box-shadow:inset 0 1px 2px #000}
.vu{position:relative;overflow:hidden;border-radius:4px;background:radial-gradient(ellipse at 50% 120%,#fff3cf 0%,#f0dfa8 55%,#d6bf80 100%);box-shadow:inset 0 2px 8px rgba(0,0,0,.55),0 0 0 3px #1a1a1a,0 0 0 4px #555}
.rbtn{border:1px solid #000;border-radius:2px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700}
.rbtn:focus-visible{outline:2px solid #3dd8ff}
</style>
</helmet>
<div style="position:relative;width:560px;height:{{H}}px;font-family:Inter,'Segoe UI',sans-serif;user-select:none">

<!-- ============ FET 1176-STYLE ============ -->
<sc-if value="{{is1176}}" hint-placeholder-val="{{true}}">
<div style="position:absolute;inset:0;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),linear-gradient(180deg,#1c1c1c,#0b0b0b);box-shadow:0 12px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)">
<div class="ear" style="left:0"><span class="hole" style="top:18px"></span><span class="hole" style="bottom:18px"></span></div>
<div class="ear" style="right:0"><span class="hole" style="top:18px"></span><span class="hole" style="bottom:18px"></span></div>
<span class="osw" style="position:absolute;left:36px;top:8px;font-size:10px;font-weight:600;letter-spacing:.18em;color:#d9d9d9">FET 76 · LIMITING AMPLIFIER</span>
<div style="position:absolute;left:36px;top:26px;display:flex;gap:18px;align-items:flex-start">
<sc-for list="{{bigKnobs}}" as="k" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div class="knob r-big" style="width:66px;height:66px" role="slider" tabIndex="0" aria-label="{{k.label}}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{k.v}}" title="{{k.label}} {{k.v}}" onPointerDown="{{k.h.down}}" onPointerMove="{{k.h.move}}" onPointerUp="{{k.h.up}}" onWheel="{{k.h.wheel}}" onDoubleClick="{{k.h.reset}}" onKeyDown="{{k.h.key}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{k.rot}}deg)"><span class="a"></span><span class="b"></span><span class="p"></span></span></div><span style="font-size:8px;font-weight:800;letter-spacing:.14em;color:#e6e6e6">{{k.label}}</span></div>
</sc-for>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{smallKnobs}}" as="k" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:6px"><div class="knob r-small" style="width:32px;height:32px" role="slider" tabIndex="0" aria-label="{{k.label}}" aria-valuemin="1" aria-valuemax="7" aria-valuenow="{{k.v}}" title="{{k.label}} {{k.v}}" onPointerDown="{{k.h.down}}" onPointerMove="{{k.h.move}}" onPointerUp="{{k.h.up}}" onWheel="{{k.h.wheel}}" onDoubleClick="{{k.h.reset}}" onKeyDown="{{k.h.key}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{k.rot}}deg)"><span class="a"></span><span class="b"></span><span class="p"></span></span></div><span style="font-size:7.5px;font-weight:800;letter-spacing:.12em;color:#e6e6e6">{{k.label}}</span></div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:286px;top:24px;display:flex;flex-direction:column;gap:3px;align-items:center">
<span style="font-size:7px;font-weight:800;letter-spacing:.14em;color:#e6e6e6">RATIO</span>
<sc-for list="{{ratios}}" as="r" hint-placeholder-count="5"><button class="rbtn" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="width:34px;height:15px;background:{{r.bg}};color:{{r.fg}};box-shadow:{{r.glow}}">{{r.l}}</button></sc-for>
</div>
<div style="position:absolute;left:334px;top:24px;display:flex;flex-direction:column;gap:3px;align-items:center">
<span style="font-size:7px;font-weight:800;letter-spacing:.14em;color:#e6e6e6">METER</span>
<sc-for list="{{meterBtns}}" as="r" hint-placeholder-count="4"><button class="rbtn" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="width:34px;height:15px;background:{{r.bg}};color:{{r.fg}}">{{r.l}}</button></sc-for>
</div>
<div class="vu" style="position:absolute;left:384px;top:20px;width:138px;height:86px;filter:{{vuFilter}}">
<svg viewBox="0 0 138 86" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
<path d="M18 66 A58 58 0 0 1 120 66" stroke="#2a2214" stroke-width="1.1" fill="none"></path>
<path d="M95 30 A58 58 0 0 1 120 66" stroke="#b5241a" stroke-width="3" fill="none"></path>
<g stroke="#2a2214" stroke-width="1.1"><path d="M18 66 l-4 -3"></path><path d="M33 39 l-3 -4"></path><path d="M53 24 l-2 -5"></path><path d="M69 20 v-6"></path><path d="M86 24 l2 -5"></path><path d="M105 39 l3 -4"></path><path d="M120 66 l4 -3"></path></g>
<text x="69" y="52" font-family="Oswald, sans-serif" font-size="8" fill="#2a2214" text-anchor="middle" letter-spacing="1.5">{{meterUnit}}</text>
<g transform="rotate({{needle}} 69 84)"><path d="M69 84 L69 18" stroke="#111" stroke-width="1.4" stroke-linecap="round"></path></g>
<circle cx="69" cy="84" r="6" fill="#1a1a1a"></circle>
</svg>
</div>
<button class="rbtn" onClick="{{toggle}}" aria-pressed="{{on}}" style="position:absolute;left:36px;bottom:8px;height:16px;padding:0 6px;display:flex;align-items:center;gap:5px;background:#1d1d1d;color:#ddd"><span style="width:6px;height:6px;border-radius:50%;background:{{ledC}};box-shadow:{{ledG}}"></span>IN</button>
<span class="mono" style="position:absolute;left:96px;bottom:10px;font-size:9px;color:#b9b9b9">GR {{grTxt}} dB</span>
</div>
</sc-if>

<!-- ============ TAPE ECHO RE-201-STYLE ============ -->
<sc-if value="{{isRe}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.6px) 0 0/4px 4px,linear-gradient(180deg,#3d5243,#25352a);box-shadow:0 14px 20px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.18);padding:10px;box-sizing:border-box">
<div style="position:relative;width:100%;height:100%;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(180deg,#1b1b1b,#090909);box-shadow:inset 0 0 0 2px #a9aeb3,inset 0 0 0 3px #222">
<span class="osw" style="position:absolute;left:14px;top:8px;font-size:15px;font-weight:700;letter-spacing:.1em;color:#ececec">TAPE ECHO 201</span>
<span style="position:absolute;left:14px;top:28px;font-size:7px;font-weight:700;letter-spacing:.2em;color:#9da3a8">ECHO · CHORUS · REVERB</span>
<div class="vu" style="position:absolute;left:14px;top:46px;width:104px;height:66px;background:radial-gradient(ellipse at 50% 120%,#eaffd8 0%,#cde9a8 55%,#a9c97c 100%);filter:{{vuFilter}}">
<svg viewBox="0 0 104 66" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
<path d="M14 52 A44 44 0 0 1 90 52" stroke="#1d2a14" stroke-width="1" fill="none"></path>
<path d="M70 22 A44 44 0 0 1 90 52" stroke="#b5241a" stroke-width="3" fill="none"></path>
<text x="52" y="40" font-family="Oswald, sans-serif" font-size="7" fill="#1d2a14" text-anchor="middle">INPUT VU</text>
<g transform="rotate({{needle}} 52 64)"><path d="M52 64 L52 14" stroke="#111" stroke-width="1.3"></path></g>
</svg>
</div>
<span style="position:absolute;left:14px;top:120px;display:flex;align-items:center;gap:5px;font-size:7px;font-weight:800;letter-spacing:.14em;color:#ddd"><span style="width:8px;height:8px;border-radius:50%;background:{{peakC}};box-shadow:{{peakG}}"></span>PEAK</span>
<button class="rbtn" onClick="{{toggle}}" aria-pressed="{{on}}" style="position:absolute;left:62px;top:116px;height:16px;padding:0 6px;display:flex;align-items:center;gap:5px;background:#1d1d1d;color:#ddd"><span style="width:6px;height:6px;border-radius:50%;background:{{ledC}};box-shadow:{{ledG}}"></span>ON</button>
<!-- mode selector -->
<div style="position:absolute;left:138px;top:6px;width:150px;height:150px">
<span style="position:absolute;left:0;right:0;top:0;text-align:center;font-size:7px;font-weight:800;letter-spacing:.2em;color:#ddd">MODE SELECTOR</span>
<sc-for list="{{modes}}" as="m" hint-placeholder-count="12"><button class="rbtn" onClick="{{m.pick}}" aria-pressed="{{m.on}}" aria-label="Modo {{m.l}}" style="position:absolute;left:{{m.x}}px;top:{{m.y}}px;width:18px;height:14px;margin:-7px 0 0 -9px;padding:0;background:{{m.bg}};color:{{m.fg}};border-color:transparent;font-size:{{m.fs}}px">{{m.l}}</button></sc-for>
<div class="knob r-chick" style="position:absolute;left:47px;top:52px;width:56px;height:56px;cursor:pointer" role="img" aria-label="Seletor no modo {{modeTxt}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{modeRot}}deg);transition:transform .15s"><span class="a"></span><span class="b"></span><span class="p"></span></span></div>
<span class="mono" style="position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:8px;color:#9da3a8">{{modeDesc}}</span>
</div>
<div style="position:absolute;left:300px;top:14px;right:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 6px">
<sc-for list="{{reKnobs}}" as="k" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:7px;font-weight:800;letter-spacing:.1em;color:#e6e6e6;white-space:nowrap">{{k.label}}</span><div class="knob r-chick" style="width:40px;height:40px" role="slider" tabIndex="0" aria-label="{{k.label}}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{k.v}}" title="{{k.label}} {{k.v}}" onPointerDown="{{k.h.down}}" onPointerMove="{{k.h.move}}" onPointerUp="{{k.h.up}}" onWheel="{{k.h.wheel}}" onDoubleClick="{{k.h.reset}}" onKeyDown="{{k.h.key}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{k.rot}}deg)"><span class="a"></span><span class="b"></span><span class="p"></span></span></div></div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- ============ PLATE REVERB ============ -->
<sc-if value="{{isPlate}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;inset:0;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,.03) 1px 2px,transparent 2px 4px),linear-gradient(180deg,#d7dbdf,#a9afb5 55%,#c6cbd0);box-shadow:0 12px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6)">
<div class="ear" style="left:0;background:linear-gradient(90deg,#7d838a,#b9bec3 40%,#737980)"><span class="hole" style="top:14px"></span><span class="hole" style="bottom:14px"></span></div>
<div class="ear" style="right:0;background:linear-gradient(90deg,#737980,#b9bec3 60%,#7d838a)"><span class="hole" style="top:14px"></span><span class="hole" style="bottom:14px"></span></div>
<span class="osw" style="position:absolute;left:36px;top:8px;font-size:12px;font-weight:700;letter-spacing:.16em;color:#1b1d20">STUDIO PLATE · PR-140</span>
<div style="position:absolute;left:36px;top:30px;width:112px;height:52px;border-radius:3px;background:#140600;box-shadow:inset 0 2px 6px #000,0 0 0 2px #2a2d31;display:flex;align-items:center;justify-content:center">
<span class="mono" style="font-size:28px;font-weight:700;color:#ff7a1a;text-shadow:0 0 8px rgba(255,110,20,.8);letter-spacing:.04em">{{decayTxt}}</span>
</div>
<span style="position:absolute;left:36px;top:86px;font-size:7px;font-weight:800;letter-spacing:.16em;color:#2a2d31">DECAY TIME (s)</span>
<div style="position:absolute;left:170px;top:22px;display:flex;gap:20px">
<sc-for list="{{plKnobs}}" as="k" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div class="knob r-alu" style="width:44px;height:44px" role="slider" tabIndex="0" aria-label="{{k.label}}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{k.v}}" title="{{k.label}} {{k.txt}}" onPointerDown="{{k.h.down}}" onPointerMove="{{k.h.move}}" onPointerUp="{{k.h.up}}" onWheel="{{k.h.wheel}}" onDoubleClick="{{k.h.reset}}" onKeyDown="{{k.h.key}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{k.rot}}deg)"><span class="a"></span><span class="b"></span><span class="p"></span></span></div><span style="font-size:7.5px;font-weight:800;letter-spacing:.12em;color:#1b1d20">{{k.label}}</span><span class="mono" style="font-size:8px;color:#3a3d42">{{k.txt}}</span></div>
</sc-for>
</div>
<div style="position:absolute;right:36px;top:26px;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
<button class="rbtn" onClick="{{toggleSpill}}" aria-pressed="{{spill}}" style="height:20px;padding:0 8px;display:flex;align-items:center;gap:6px;background:#2a2d31;color:#eee"><span style="width:7px;height:7px;border-radius:50%;background:{{spillC}};box-shadow:{{spillG}}"></span>SPILLOVER</button>
<button class="rbtn" onClick="{{toggle}}" aria-pressed="{{on}}" style="height:20px;padding:0 8px;display:flex;align-items:center;gap:6px;background:#2a2d31;color:#eee"><span style="width:7px;height:7px;border-radius:50%;background:{{ledC}};box-shadow:{{ledG}}"></span>ENGAGE</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"model":{"editor":"enum","options":["comp1176","re201","plate"],"default":"comp1176"},"vals":{"editor":null},"onSet":{"editor":null},"on":{"editor":"boolean","default":true},"onToggle":{"editor":null},"$preview":{"width":560,"height":190}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { local: {}, onLocal: true, tick: 0 }; this.hc = {}; this.drag = null; }
  componentDidMount() { this.timer = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 90); }
  componentWillUnmount() { clearInterval(this.timer); }
  vals() { return this.props.vals || this.state.local; }
  get(fk, def) { const v = this.vals()[fk]; return v === undefined ? def : v; }
  set(fk, v) { if (this.props.onSet) this.props.onSet(fk, v); else this.setState((s) => ({ local: Object.assign({}, s.local, { [fk]: v }) })); }
  isOn() { return this.props.onToggle ? this.props.on !== false : this.state.onLocal; }
  h(fk, def, lo, hi) {
    if (this.hc[fk]) return this.hc[fk];
    const self = this, L = lo === undefined ? 0 : lo, Hh = hi === undefined ? 10 : hi;
    const clamp = (x) => Math.max(L, Math.min(Hh, Math.round(x * 10) / 10));
    const span = (Hh - L) / 10;
    this.hc[fk] = {
      down(e) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} self.drag = { fk, x: e.clientX, y: e.clientY, v: self.get(fk, def) }; },
      move(e) { const d = self.drag; if (!d || d.fk !== fk) return; const k = e.shiftKey ? 60 : 14; self.set(fk, clamp(d.v + span * ((e.clientX - d.x) + (d.y - e.clientY)) / k)); },
      up() { self.drag = null; },
      wheel(e) { self.set(fk, clamp(self.get(fk, def) + span * (e.deltaY < 0 ? 0.2 : -0.2))); },
      reset() { self.set(fk, def); },
      key(e) { const d = { ArrowUp: 0.5, ArrowRight: 0.5, ArrowDown: -0.5, ArrowLeft: -0.5 }[e.key]; if (d) { e.preventDefault(); self.set(fk, clamp(self.get(fk, def) + span * d)); } }
    };
    return this.hc[fk];
  }
  renderVals() {
    const model = ['comp1176','re201','plate'].indexOf(this.props.model) >= 0 ? this.props.model : 'comp1176';
    const fk = (k) => model + '.' + k, on = this.isOn(), t = this.state.tick;
    const toggle = () => { if (this.props.onToggle) this.props.onToggle(!on); else this.setState((s) => ({ onLocal: !s.onLocal })); };
    const sig = Math.abs(Math.sin(t * 0.23)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 0.07 + 1)));
    const rot = (v, lo, hi) => Math.round(-135 + (v - lo) / (hi - lo) * 270);
    const out = { H: { comp1176: 130, re201: 190, plate: 110 }[model], is1176: model === 'comp1176', isRe: model === 're201', isPlate: model === 'plate', on, toggle,
      ledC: on ? '#ff3b1f' : '#3a1210', ledG: on ? '0 0 7px #ff3b1f' : 'none', vuFilter: on ? 'none' : 'brightness(.55)',
      bigKnobs: [], smallKnobs: [], ratios: [], meterBtns: [], grTxt: '', meterUnit: '', needle: -50,
      modes: [], modeRot: 0, modeTxt: '', modeDesc: '', reKnobs: [], peakC: '#3a1210', peakG: 'none',
      plKnobs: [], decayTxt: '', spill: false, toggleSpill: () => {}, spillC: '', spillG: 'none' };

    if (model === 'comp1176') {
      const inV = this.get(fk('input'), 6), outV = this.get(fk('output'), 5);
      out.bigKnobs = [['input','INPUT',6], ['output','OUTPUT',5]].map(([k, l, d]) => { const v = this.get(fk(k), d); return { label: l, v: v.toFixed(1), rot: rot(v, 0, 10), h: this.h(fk(k), d) }; });
      out.smallKnobs = [['attack','ATTACK',3], ['release','RELEASE',5]].map(([k, l, d]) => { const v = this.get(fk(k), d); return { label: l, v: v.toFixed(1), rot: rot(v, 1, 7), h: this.h(fk(k), d, 1, 7) }; });
      const ratio = this.get(fk('ratio'), '4');
      out.ratios = ['20','12','8','4','ALL'].map((r) => { const key = r === 'ALL' ? 'all' : r; const lit = ratio === key || (ratio === 'all' && r !== 'ALL');
        return { l: r === 'ALL' ? 'ALL' : r, on: ratio === key, pick: () => this.set(fk('ratio'), key), bg: lit ? 'linear-gradient(180deg,#fffef6,#d6d2c2)' : 'linear-gradient(180deg,#e8e8e8,#a9a9a9)', fg: '#111', glow: lit ? '0 0 6px rgba(255,240,180,.8)' : 'none' }; });
      const meter = this.get(fk('meter'), 'GR');
      out.meterBtns = ['GR','+8','+4','OFF'].map((m) => ({ l: m, on: meter === m, pick: () => this.set(fk('meter'), m), bg: meter === m ? 'linear-gradient(180deg,#fffef6,#d6d2c2)' : 'linear-gradient(180deg,#e8e8e8,#a9a9a9)', fg: '#111' }));
      const rf = { '4': 0.5, '8': 0.7, '12': 0.82, '20': 0.92, 'all': 1.15 }[ratio];
      const gr = on ? Math.min(20, sig * inV * 1.6 * rf) : 0;
      const outLvl = on ? (sig * 0.8 + outV / 20) : 0;
      out.grTxt = '−' + gr.toFixed(1);
      out.meterUnit = meter === 'GR' ? 'GAIN REDUCTION' : 'VU';
      out.needle = meter === 'OFF' ? -50 : (meter === 'GR' ? (50 - gr * 4.5).toFixed(1) : (-50 + Math.min(1, outLvl * (meter === '+8' ? 0.6 : 0.85)) * 100).toFixed(1));
    }
    if (model === 're201') {
      const mode = this.get(fk('mode'), 4);
      const desc = ['', 'cabeça 1', 'cabeça 2', 'cabeça 3', 'cabeças 2+3', 'cabeças 1+2', 'cabeças 1+3', 'cabeças 1+2+3', '1 + reverb', '2 + reverb', '3 + reverb', 'só reverb', '1+2+3 + reverb'];
      out.modes = Array.from({ length: 12 }, (_, i) => { const n = i + 1; const a = (-135 + i * (270 / 11)) * Math.PI / 180; const R = 60;
        return { l: n === 11 ? 'R' : String(n), on: mode === n, fs: 8, x: Math.round(75 + R * Math.sin(a)), y: Math.round(80 - R * Math.cos(a)),
          bg: mode === n ? '#e8e8e8' : 'transparent', fg: mode === n ? '#111' : '#d6d6d6', pick: () => this.set(fk('mode'), n) }; });
      out.modeRot = Math.round(-135 + (mode - 1) * (270 / 11));
      out.modeTxt = String(mode); out.modeDesc = 'MODO ' + mode + ' · ' + desc[mode];
      out.reKnobs = [['repeat_rate','REPEAT RATE',4.5], ['intensity','INTENSITY',5.5], ['echo_volume','ECHO VOL',4], ['bass','BASS',5], ['treble','TREBLE',5], ['reverb_volume','REVERB VOL',3]]
        .map(([k, l, d]) => { const v = this.get(fk(k), d); return { label: l, v: v.toFixed(1), rot: rot(v, 0, 10), h: this.h(fk(k), d) }; });
      const inten = this.get(fk('intensity'), 5.5);
      const peak = on && (inten > 8.5 || sig > 0.92);
      out.peakC = peak ? '#ff3b1f' : '#3a1210'; out.peakG = peak ? '0 0 8px #ff3b1f' : 'none';
      out.needle = on ? (-50 + sig * 85).toFixed(1) : -50;
    }
    if (model === 'plate') {
      const P = [['decay','DECAY',4, (v) => (0.5 + v * 0.55).toFixed(1) + ' s'], ['predelay','PRE-DELAY',2, (v) => Math.round(v * 15) + ' ms'], ['damping','DAMPING',5, (v) => v.toFixed(1)], ['mix','MIX',3, (v) => Math.round(v * 10) + ' %']];
      out.plKnobs = P.map(([k, l, d, f]) => { const v = this.get(fk(k), d); return { label: l, v: v.toFixed(1), txt: f(v), rot: rot(v, 0, 10), h: this.h(fk(k), d) }; });
      out.decayTxt = on ? (0.5 + this.get(fk('decay'), 4) * 0.55).toFixed(1) : '--';
      const spill = this.get(fk('spillover'), true);
      out.spill = spill; out.toggleSpill = () => this.set(fk('spillover'), !spill);
      out.spillC = spill ? '#29e07a' : '#123a22'; out.spillG = spill ? '0 0 6px #29e07a' : 'none';
    }
    return out;
  }
}
