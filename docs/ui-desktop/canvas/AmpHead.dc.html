<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AmpHead — cabeçote por modelo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Oswald:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.osw{font-family:Oswald,'Arial Narrow',sans-serif}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.tolex{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/4px 4px,radial-gradient(circle at 2px 3px,rgba(0,0,0,.5) 1px,transparent 1.8px) 0 0/5px 5px,linear-gradient(180deg,#1d1d1d,#0f0f0f)}
.g-plexi{background:repeating-linear-gradient(0deg,rgba(40,25,5,.38) 0 2px,transparent 2px 6px),repeating-linear-gradient(90deg,rgba(40,25,5,.3) 0 2px,transparent 2px 6px),repeating-linear-gradient(45deg,rgba(255,240,200,.1) 0 1px,transparent 1px 4px),linear-gradient(180deg,#c2a674 0%,#9b8257 55%,#6f5c3c 100%)}
.g-800{background:radial-gradient(circle at 1px 1px,rgba(220,190,120,.32) 1px,transparent 1.5px) 0 0/4px 4px,repeating-linear-gradient(45deg,rgba(0,0,0,.5) 0 2px,transparent 2px 5px),repeating-linear-gradient(-45deg,rgba(0,0,0,.4) 0 2px,transparent 2px 5px),linear-gradient(180deg,#3d372c 0%,#26221b 60%,#18150f 100%)}
.g-fender{background:repeating-linear-gradient(0deg,rgba(30,40,60,.32) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(30,40,60,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.25),transparent 60%),linear-gradient(180deg,#d8dad6 0%,#b7bab5 60%,#979a96 100%)}
.g-mesa{background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.6) 8px 9px,rgba(0,0,0,.4) 9px 11px,transparent 11px 16px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.35) 8px 9px,rgba(0,0,0,.3) 9px 11px,transparent 11px 16px),linear-gradient(180deg,#d4d8dc 0%,#8f949a 55%,#5d6268 100%)}
.g-vox{background:repeating-linear-gradient(45deg,rgba(236,214,160,.6) 0 1.2px,transparent 1.2px 10px),repeating-linear-gradient(-45deg,rgba(236,214,160,.6) 0 1.2px,transparent 1.2px 10px),repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),linear-gradient(180deg,#6d4328 0%,#4b2c18 60%,#321c0f 100%)}
.knob{position:relative;border-radius:50%;cursor:ns-resize;touch-action:none;outline:none;flex:none}
.knob:focus-visible{box-shadow:0 0 0 3px #3dd8ff}
.knob .sh{position:absolute;inset:0;border-radius:50%;box-shadow:0 8px 12px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.85)}
.knob .rotor{position:absolute;inset:0;border-radius:50%}
.knob .a,.knob .b,.knob .p{position:absolute;display:block}
.k-marshall .rotor{background:repeating-conic-gradient(#0b0b0b 0 5deg,#2b2b2b 5deg 10deg);box-shadow:inset 0 0 0 2px #050505}
.k-marshall .a{inset:21%;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff8da 0%,#ebcb74 28%,#ad822c 72%,#6a4c12 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.45)}
.k-marshall .p{left:50%;top:3%;width:3px;height:26%;margin-left:-1.5px;background:#fbfbfb;border-radius:2px}
.k-fender .rotor{background:radial-gradient(circle at 40% 30%,#3b3b3b,#0d0d0d 72%)}
.k-fender .a{inset:0;border-radius:50%;background:repeating-conic-gradient(from -135deg,#ececec 0 2.2deg,transparent 2.2deg 27deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 65%,#000 82%,transparent 84%);mask:radial-gradient(circle,transparent 63%,#000 65%,#000 82%,transparent 84%)}
.k-fender .b{inset:22%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#303030,#060606 80%);box-shadow:0 2px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.15)}
.k-fender .p{left:50%;top:1%;width:3px;height:20%;margin-left:-1.5px;background:#fff;border-radius:1px}
.k-mesa .rotor{background:repeating-conic-gradient(#121212 0 6deg,#2e2e2e 6deg 12deg)}
.k-mesa .a{inset:14%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#3a3a3a,#0a0a0a 75%)}
.k-mesa .b{inset:36%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9bec4 45%,#5e6369)}
.k-mesa .p{left:50%;top:15%;width:2px;height:20%;margin-left:-1px;background:#f2f2f2}
.k-vox .a{inset:16%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fffbea,#e3d6b4 55%,#a99a74);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.k-vox .b{left:33%;right:33%;top:-6%;bottom:32%;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:linear-gradient(90deg,#c4b58d,#f6eed6 45%,#c6b892);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.k-vox .p{left:50%;top:-2%;width:2px;height:34%;margin-left:-1px;background:#3a2a14}
.jack{position:relative;width:28px;height:28px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle,#050505 0 32%,#d9d9d9 36%,#8d8d8d 52%,#cfcfcf 62%,#3b3b3b 66%,#1c1c1c 100%);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.jack:focus-visible{outline:2px solid #3dd8ff}
.plug{position:absolute;left:50%;top:50%;width:14px;height:34px;margin:-6px 0 0 -7px;border-radius:4px 4px 2px 2px;background:linear-gradient(90deg,#0a0a0a,#3d3d3d 45%,#0a0a0a);box-shadow:0 6px 8px rgba(0,0,0,.6)}
.bat{position:relative;width:26px;height:44px;border:0;padding:0;background:transparent;cursor:pointer}
.bat:focus-visible{outline:2px solid #3dd8ff}
.bat .nut{position:absolute;left:3px;top:13px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#a9aeb4 55%,#50555b);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.bat .lev{position:absolute;left:9px;width:8px;height:20px;border-radius:4px;background:linear-gradient(90deg,#8d9298,#f4f6f8 45%,#7d8288);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.jewel{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ffe2d6 0%,#ff4a2a 22%,#c3150c 55%,#5c0703 100%);box-shadow:0 0 18px rgba(255,50,20,.85),0 0 0 4px #b8b8b8,0 0 0 6px #555;transition:filter .3s}
.rocker{position:relative;width:28px;height:42px;border:0;padding:0;border-radius:3px;cursor:pointer;background:#0d0d0d;box-shadow:inset 0 0 0 2px #2b2b2b,0 2px 4px rgba(0,0,0,.6)}
.rocker .face{position:absolute;left:4px;right:4px;top:4px;bottom:4px;border-radius:2px;transition:background .12s,box-shadow .2s}
.selbtn{display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:3px;border:1px solid #000;font-size:9px;font-weight:700;letter-spacing:.06em;cursor:pointer;background:linear-gradient(180deg,#2c2c2c,#121212);color:#ddd}
</style>
</helmet>
<div class="tolex" style="width:100%;height:282px;border-radius:12px;padding:12px;box-sizing:border-box;display:flex;flex-direction:{{dir}};gap:8px;box-shadow:0 26px 40px rgba(0,0,0,.75),0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.08);position:relative;font-family:Inter,'Segoe UI',sans-serif;user-select:none">
<span style="position:absolute;left:50%;top:-7px;margin-left:-62px;width:124px;height:12px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#2a2a2a,#0a0a0a);box-shadow:0 2px 3px rgba(0,0,0,.7)"></span>

<!-- GRILLE -->
<div class="{{grille}}" style="flex:1;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:{{piping}}">
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(255,120,30,{{grilleGlow}}) 0%,transparent 65%);pointer-events:none"></div>
<div style="position:relative;padding:7px 24px;border-radius:5px;background:{{badgeBg}};box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.3);transform:{{badgeTf}}">
<span class="osw" style="font-size:30px;font-weight:700;letter-spacing:.12em;color:{{badgeInk}};font-style:{{badgeStyle}};text-shadow:0 1px 0 rgba(255,255,255,.35)">{{title}}</span>
</div>
<span class="mono" style="position:absolute;right:16px;bottom:9px;font-size:10px;letter-spacing:.14em;color:{{subInk}}">{{sub}}</span>
</div>

<!-- CONTROL PANEL -->
<div style="height:130px;border-radius:5px;padding:10px 20px;box-sizing:border-box;display:flex;align-items:center;gap:18px;background:{{panelBg}};box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.3),0 2px 3px rgba(0,0,0,.5);border:{{panelBorder}}">

<sc-if value="{{powerLeft}}" hint-placeholder-val="{{true}}">
<div style="display:flex;align-items:center;gap:12px">
<sc-for list="{{powerItems}}" as="p" hint-placeholder-count="3">
<sc-if value="{{p.isBat}}" hint-placeholder-val="{{true}}"><div style="display:flex;flex-direction:column;align-items:center;gap:1px"><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.1em;color:{{ink}}">{{p.topTxt}}</span><button class="bat" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" title="{{p.aria}}"><span class="nut"></span><span class="lev" style="top:{{p.top}}px"></span></button><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.1em;color:{{ink}}">{{p.botTxt}}</span></div></sc-if>
<sc-if value="{{p.isJewel}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div class="jewel" role="img" aria-label="Indicador" style="width:22px;height:22px;filter:{{jewelFilter}}"></div><span class="osw" style="font-size:7.5px;font-weight:600;letter-spacing:.1em;color:{{ink}}">{{p.botTxt}}</span></div></sc-if>
<sc-if value="{{p.isRocker}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span class="osw" style="font-size:9px;color:{{ink}}">0</span><button class="rocker" onClick="{{p.toggle}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" title="{{p.aria}}"><span class="face" style="background:{{p.face}};box-shadow:{{p.glow}}"></span></button><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.1em;color:{{ink}}">{{p.botTxt}}</span></div></sc-if>
<sc-if value="{{p.isLogo}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;line-height:1;margin-left:10px;gap:3px"><span class="osw" style="font-size:25px;font-style:italic;font-weight:700;letter-spacing:.03em;color:{{ink}}">{{p.l1}}</span><span class="osw" style="font-size:11px;font-style:italic;font-weight:600;letter-spacing:.16em;color:{{ink}}">{{p.l2}}</span></div></sc-if>
</sc-for>
</div>
<div style="width:1px;align-self:stretch;background:{{rule}}"></div>
</sc-if>

<sc-if value="{{jacksLeft}}" hint-placeholder-val="{{false}}">
<div style="display:flex;gap:10px;align-items:flex-start">
<sc-for list="{{jacks}}" as="j" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.08em;color:{{ink}};white-space:nowrap">{{j.label}}</span><button class="jack" onClick="{{j.pick}}" aria-pressed="{{j.on}}" aria-label="Entrada {{j.label}}"><span class="plug" style="opacity:{{j.plugOp}}"></span></button><span class="osw" style="font-size:8px;color:{{ink}}">{{j.sub}}</span></div></sc-for>
</div>
<div style="width:1px;align-self:stretch;background:{{rule}}"></div>
</sc-if>

<div style="flex:1;display:flex;align-items:center;justify-content:space-around;gap:14px;min-width:0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:6px;opacity:{{g.op}};transition:opacity .2s;border-top:{{g.border}};padding-top:{{g.pad}}">
<sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{false}}"><span class="osw" style="font-size:10px;font-weight:700;letter-spacing:.18em;color:{{ink}};text-align:center">{{g.title}}</span></sc-if>
<div style="display:flex;align-items:flex-end;gap:{{g.gap}}px">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
<sc-if value="{{it.isKnob}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
<span class="osw" style="font-size:{{labelPx}}px;font-weight:600;letter-spacing:.08em;color:{{ink}};white-space:nowrap;min-height:15px">{{it.label}}</span>
<div class="{{it.cls}}" style="width:{{it.px}}px;height:{{it.px}}px" role="slider" tabIndex="0" aria-label="{{it.label}}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{it.v}}" title="{{it.label}} {{it.v}}" onPointerDown="{{it.h.down}}" onPointerMove="{{it.h.move}}" onPointerUp="{{it.h.up}}" onWheel="{{it.h.wheel}}" onDoubleClick="{{it.h.reset}}" onKeyDown="{{it.h.key}}"><span class="sh"></span><span class="rotor" style="transform:rotate({{it.rot}}deg)"><span class="a"></span><span class="b"></span><span class="p"></span></span></div>
<div style="position:relative;min-height:15px;display:flex;justify-content:center"><span class="osw" style="font-size:{{labelPx}}px;font-weight:600;letter-spacing:.08em;color:{{ink}};white-space:nowrap">{{it.sub}}</span><span class="mono" style="position:absolute;top:0;font-size:10px;font-weight:700;color:{{chipInk}};background:{{chipBg}};padding:0 5px;border-radius:3px;opacity:{{it.chipOp}};transition:opacity .2s">{{it.v}}</span></div>
</div>
</sc-if>
<sc-if value="{{it.isBat}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
<span class="osw" style="font-size:9px;font-weight:600;letter-spacing:.08em;color:{{ink}};white-space:nowrap">{{it.label}}</span>
<span class="osw" style="font-size:7.5px;color:{{ink}};opacity:.8">{{it.onTxt}}</span>
<button class="bat" onClick="{{it.toggle}}" aria-pressed="{{it.on}}" aria-label="{{it.label}}"><span class="nut"></span><span class="lev" style="top:{{it.top}}px"></span></button>
<span class="osw" style="font-size:7.5px;color:{{ink}};opacity:.8">{{it.offTxt}}</span>
</div>
</sc-if>
<sc-if value="{{it.isSel}}" hint-placeholder-val="{{false}}">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px">
<sc-for list="{{it.opts}}" as="o" hint-placeholder-count="4"><button class="selbtn" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span style="width:7px;height:7px;border-radius:50%;background:{{o.led}};box-shadow:{{o.glow}}"></span>{{o.l}}</button></sc-for>
</div>
</sc-if>
</sc-for>
</div>
</div>
</sc-for>
</div>

<sc-if value="{{jacksRight}}" hint-placeholder-val="{{true}}">
<div style="width:1px;align-self:stretch;background:{{rule}}"></div>
<div style="display:flex;gap:10px;align-items:flex-start">
<sc-for list="{{jacks}}" as="j" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.08em;color:{{ink}};white-space:nowrap">{{j.label}}</span><button class="jack" onClick="{{j.pick}}" aria-pressed="{{j.on}}" aria-label="Entrada {{j.label}} {{j.sub}}"><span class="plug" style="opacity:{{j.plugOp}}"></span></button><span class="osw" style="font-size:8px;color:{{ink}}">{{j.sub}}</span></div></sc-for>
</div>
</sc-if>

<sc-if value="{{gridJacks}}" hint-placeholder-val="{{false}}">
<div style="width:1px;align-self:stretch;background:{{rule}}"></div>
<div style="display:flex;align-items:center;gap:8px">
<div style="position:relative;display:grid;grid-template-columns:repeat({{jackCols}},34px);grid-auto-rows:auto;gap:6px 10px;justify-items:center;align-items:center">
<sc-for list="{{gjacks}}" as="j" hint-placeholder-count="4"><div style="grid-column:{{j.c}};grid-row:{{j.r}};width:34px;height:34px;display:flex;align-items:center;justify-content:center"><button class="jack" onClick="{{j.pick}}" aria-pressed="{{j.on}}" aria-label="{{j.aria}}" title="{{j.aria}}"><span class="plug" style="opacity:{{j.plugOp}}"></span></button></div></sc-for>
<sc-for list="{{gcaps}}" as="c" hint-placeholder-count="2"><span class="osw" style="grid-column:{{c.c}};grid-row:3;font-size:10px;font-weight:700;color:{{ink}}">{{c.t}}</span></sc-for>
<sc-if value="{{jumperOn}}" hint-placeholder-val="{{false}}"><svg width="80" height="120" viewBox="0 0 80 120" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" aria-hidden="true"><path d="M17 86 C 17 118, 61 112, 61 46" fill="none" stroke="#0b0b0b" stroke-width="5" stroke-linecap="round"/><path d="M17 86 C 17 118, 61 112, 61 46" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.4" stroke-linecap="round" transform="translate(-1,-1)"/></svg></sc-if>
</div>
<div style="display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;height:78px;gap:2px">
<sc-for list="{{jackSide}}" as="s" hint-placeholder-count="3"><span class="osw" style="font-size:8.5px;font-weight:600;letter-spacing:.1em;color:{{ink}};min-height:10px">{{s.t}}</span></sc-for>
<sc-if value="{{hasJumper}}" hint-placeholder-val="{{false}}"><button class="selbtn" onClick="{{toggleJumper}}" aria-pressed="{{jumperOn}}" title="Ponte: guitarra em I-High, cabo de I-Low para II-High (manual 1959HW, fig. 1)"><span style="width:7px;height:7px;border-radius:50%;background:{{jumperLed}};box-shadow:{{jumperGlow}}"></span>JUMPER</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{powerRight}}" hint-placeholder-val="{{false}}">
<div style="width:1px;align-self:stretch;background:{{rule}}"></div>
<div style="display:flex;align-items:center;gap:12px">
<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="osw" style="font-size:9px;font-weight:600;letter-spacing:.1em;color:{{ink}}">STANDBY</span><button class="bat" onClick="{{toggleStandby}}" aria-pressed="{{standbyOn}}" aria-label="Standby"><span class="nut"></span><span class="lev" style="top:{{standbyTop}}px"></span></button></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="osw" style="font-size:9px;font-weight:600;letter-spacing:.1em;color:{{ink}}">POWER</span><button class="bat" onClick="{{toggleMains}}" aria-pressed="{{mainsOn}}" aria-label="Power"><span class="nut"></span><span class="lev" style="top:{{mainsTop}}px"></span></button></div>
<div class="jewel" role="img" aria-label="Lâmpada piloto" style="filter:{{jewelFilter}}"></div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"model":{"editor":"enum","options":["plexi_1959","jcm800_2203","twin_ab763","dual_rect","ac30_tb"],"default":"jcm800_2203"},"vals":{"editor":null},"onSet":{"editor":null},"$preview":{"width":1000,"height":282}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { local: {}, dragKey: null };
    this.hc = {};
    this.drag = null;
  }
  models() {
    if (this._m) return this._m;
    // Ordem e rótulos dos painéis Marshall conferidos nos manuais oficiais:
    // 1959HW Owners Manual (painel frontal itens 1–13) e JCM800 2203 Owners Manual BOOK-00067-00 (itens 1–10).
    const K = (key, label, def, sub) => ({ t: 'knob', key, label, def, sub: sub || '' });
    const B = (key, label, onTxt, offTxt, def) => ({ t: 'bat', key, label, onTxt, offTxt, def: !!def });
    const S = (key, label, opts, def) => ({ t: 'sel', key, label, opts, def });
    this._m = {
      // 1959HW: POWER · STANDBY · INDICATOR · PRESENCE · BASS · MIDDLE · TREBLE · VOLUME I · VOLUME II · entradas 2×2 (High em cima, Low embaixo; Canal I à esquerda, Canal II à direita)
      plexi_1959: { title: 'BRIT PLEXI', sub: 'MODEL 1959 · SUPER LEAD 100W · 1969', skin: 'marshall', head: true, grille: 'g-plexi', knob: 54, power: 'left', powerStyle: 'toggle',
        jacks: { key: 'input_jack', def: 'jumpered', grid: { cols: 2, jumper: 'jumpered',
          list: [['high1','Canal I · High (brilhante)',1,1], ['low1','Canal I · Low (−6 dB)',1,2], ['high2','Canal II · High (Normal)',2,1], ['low2','Canal II · Low (−6 dB)',2,2]],
          caps: [['I',1],['II',2]], side: ['', 'INPUTS', ''] } },
        groups: [{ items: [K('presence','PRESENCE',5), K('bass','BASS',5), K('middle','MIDDLE',6), K('treble','TREBLE',6.5), K('gain','',7,'VOLUME I'), K('volume_2','',4,'VOLUME II')] }] },
      // JCM800 2203: POWER · STANDBY · logotipo · PRESENCE · BASS · MIDDLE · TREBLE · MASTER VOLUME · PRE-AMP VOLUME · HIGH/LOW empilhadas
      jcm800_2203: { title: 'BRIT 800', sub: 'MODEL 2203 · MASTER VOLUME 100W · 1981', skin: 'marshall', head: true, grille: 'g-800', knob: 54, power: 'left', powerStyle: 'rocker', logo: ['BRIT 800', 'LEAD SERIES'],
        jacks: { key: 'input_jack', def: 'high', grid: { cols: 1,
          list: [['high','High sensitivity',1,1], ['low','Low sensitivity (−6 dB)',1,2]],
          caps: [], side: ['HIGH', 'SENSITIVITY', 'LOW'] } },
        groups: [{ items: [K('presence','PRESENCE',5.5), K('bass','BASS',4), K('middle','MIDDLE',6.5), K('treble','TREBLE',6), K('master','MASTER',3.5,'VOLUME'), K('gain','PRE-AMP',7.5,'VOLUME')] }] },
      twin_ab763: { title: 'US TWIN', sub: 'REVERB-AMP · AB763', skin: 'fender', head: false, grille: 'g-fender', knob: 40, power: 'right',
        jacks: { key: 'channel', def: 'vibrato', list: [['normal','NORMAL',''],['vibrato','VIBRATO','']] }, jacksSide: 'left',
        groups: [
          { title: 'NORMAL', ch: 'normal', items: [B('n_bright','BRIGHT','ON','OFF',false), K('n_volume','VOLUME',4), K('n_treble','TREBLE',6), K('n_middle','MIDDLE',5), K('n_bass','BASS',4)] },
          { title: 'VIBRATO', ch: 'vibrato', items: [B('v_bright','BRIGHT','ON','OFF',true), K('v_volume','VOLUME',4), K('v_treble','TREBLE',6.5), K('v_middle','MIDDLE',4.5), K('v_bass','BASS',4), K('v_reverb','REVERB',3), K('v_speed','SPEED',4), K('v_intensity','INTENSITY',0)] }] },
      dual_rect: { title: 'CALI RECTO', sub: 'DUAL RECTIFIED · REV F', skin: 'mesa', head: true, grille: 'g-mesa', knob: 50, power: 'right', jacks: null,
        groups: [
          { title: 'MODO', items: [S('channel_mode','CANAL',[['clean','CLEAN'],['pushed','PUSHED'],['vintage','VINTAGE'],['modern','MODERN']],'modern')] },
          { items: [K('gain','GAIN',7), K('treble','TREBLE',6), K('middle','MID',4), K('bass','BASS',6), K('presence','PRESENCE',5), K('master','MASTER',3.5)] },
          { title: 'TRASEIRO', items: [B('rectifier','RECTIFIER','TUBE','DIODE',false), B('power_mode','POWER','SPONGY','BOLD',false)] }] },
      ac30_tb: { title: 'UK 30', sub: 'TOP BOOST · 4×EL84 · CLASS A', skin: 'vox', head: false, grille: 'g-vox', knob: 46, power: 'right',
        jacks: { key: 'channel', def: 'top_boost', list: [['normal','NORMAL',''],['top_boost','TOP BOOST','']] }, jacksSide: 'left',
        groups: [
          { title: 'TOP BOOST', items: [K('gain','VOLUME',6), K('treble','TREBLE',6), K('bass','BASS',5), K('cut','CUT',4)] },
          { title: 'VIB-TREM', items: [K('vib_speed','SPEED',3), K('vib_depth','DEPTH',0)] }] }
    };
    return this._m;
  }
  model() { const m = this.props.model; return this.models()[m] ? m : 'jcm800_2203'; }
  vals() { return this.props.vals || this.state.local; }
  get(fk, def) { const v = this.vals()[fk]; return v === undefined ? def : v; }
  set(fk, v) {
    if (this.props.onSet) this.props.onSet(fk, v);
    else this.setState((s) => ({ local: Object.assign({}, s.local, { [fk]: v }) }));
  }
  h(fk, def) {
    if (this.hc[fk]) return this.hc[fk];
    const self = this;
    const clamp = (x) => Math.max(0, Math.min(10, Math.round(x * 10) / 10));
    this.hc[fk] = {
      down(e) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} self.drag = { fk, y: e.clientY, x: e.clientX, v: self.get(fk, def), fine: e.shiftKey }; self.setState({ dragKey: fk }); },
      move(e) { const d = self.drag; if (!d || d.fk !== fk) return; const k = e.shiftKey ? 60 : 16; self.set(fk, clamp(d.v + ((e.clientX - d.x) + (d.y - e.clientY)) / k)); },
      up() { self.drag = null; self.setState({ dragKey: null }); },
      wheel(e) { self.set(fk, clamp(self.get(fk, def) + (e.deltaY < 0 ? 0.2 : -0.2))); },
      reset() { self.set(fk, def); },
      key(e) { const d = { ArrowUp: 0.5, ArrowRight: 0.5, ArrowDown: -0.5, ArrowLeft: -0.5 }[e.key]; if (d) { e.preventDefault(); self.set(fk, clamp(self.get(fk, def) + d)); } }
    };
    return this.hc[fk];
  }
  renderVals() {
    const id = this.model(), M = this.models()[id];
    const fk = (k) => id + '.' + k;
    const SK = {
      marshall: { panel: 'repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),linear-gradient(180deg,#f3dc95 0%,#dcb658 40%,#b88c33 52%,#d9b45d 70%,#ecd08a 100%)', ink: '#2a1c04', rule: 'rgba(42,29,6,.35)', border: 'none',
        badge: 'repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),linear-gradient(180deg,#f3dc95,#c99d43 55%,#e6c677)', badgeInk: '#2a1c04', piping: 'inset 0 0 0 2px #ece6d6,inset 0 0 0 3px rgba(0,0,0,.6)', label: 12, chipBg: 'rgba(255,255,255,.7)', chipInk: '#2a1c04' },
      fender: { panel: 'radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.06),transparent 60%),linear-gradient(180deg,#181818,#070707)', ink: '#f1f1f1', rule: 'rgba(255,255,255,.18)', border: '2px solid #a9aeb3',
        badge: 'linear-gradient(180deg,#ffffff,#c3c8cd 45%,#8b9197 55%,#e3e6e9)', badgeInk: '#151515', piping: 'inset 0 0 0 3px #1a1a1a', label: 10, chipBg: 'rgba(255,255,255,.85)', chipInk: '#111' },
      mesa: { panel: 'repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),linear-gradient(180deg,#242424,#0c0c0c)', ink: '#e8e8e8', rule: 'rgba(255,255,255,.16)', border: '2px solid #8f949a',
        badge: 'linear-gradient(180deg,#f4f6f8,#aab0b6 50%,#e1e4e7)', badgeInk: '#141414', piping: 'inset 0 0 0 3px #1c1c1c,inset 0 0 0 5px #8f949a', label: 11, chipBg: 'rgba(255,255,255,.85)', chipInk: '#111' },
      vox: { panel: 'repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(180deg,#dda374 0%,#b0703f 50%,#cf9160 100%)', ink: '#2a1407', rule: 'rgba(42,20,7,.35)', border: 'none',
        badge: 'linear-gradient(180deg,#f2d79a,#b98b3c 55%,#e4c37c)', badgeInk: '#2a1407', piping: 'inset 0 0 0 2px #e8d6a8,inset 0 0 0 3px rgba(0,0,0,.6)', label: 11, chipBg: 'rgba(255,255,255,.7)', chipInk: '#2a1407' }
    }[M.skin];

    const mains = this.get(fk('mains'), true), standby = this.get(fk('standby'), false);
    const live = mains && !standby;
    const activeCh = M.jacks ? this.get(fk(M.jacks.key), M.jacks.def) : null;

    const groups = M.groups.map((g) => {
      const dim = g.ch && activeCh && g.ch !== activeCh;
      return {
        hasTitle: !!g.title, title: g.title || '', op: dim ? 0.45 : 1,
        border: g.title ? '1px solid ' + SK.rule : 'none', pad: g.title ? 4 : 0,
        gap: M.knob < 46 ? 10 : 16,
        items: g.items.map((it) => {
          if (it.t === 'knob') {
            const v = this.get(fk(it.key), it.def);
            return { isKnob: true, isBat: false, isSel: false, label: it.label, sub: it.sub || '', cls: 'knob k-' + M.skin, px: M.knob,
              v: v.toFixed(1), rot: Math.round(-135 + v * 27), h: this.h(fk(it.key), it.def),
              chipOp: this.state.dragKey === fk(it.key) ? 1 : 0 };
          }
          if (it.t === 'bat') {
            const on = this.get(fk(it.key), it.def);
            return { isKnob: false, isBat: true, isSel: false, label: it.label, onTxt: it.onTxt, offTxt: it.offTxt, on, top: on ? 2 : 22,
              toggle: () => this.set(fk(it.key), !on) };
          }
          const cur = this.get(fk(it.key), it.def);
          return { isKnob: false, isBat: false, isSel: true, label: it.label,
            opts: it.opts.map(([v, l]) => ({ l, on: cur === v, pick: () => this.set(fk(it.key), v),
              led: cur === v ? (v === 'modern' || v === 'pushed' ? '#ff3b2f' : '#29e07a') : '#2a2a2a',
              glow: cur === v ? '0 0 6px ' + (v === 'modern' || v === 'pushed' ? '#ff3b2f' : '#29e07a') : 'none' })) };
        })
      };
    });

    const jacks = M.jacks && M.jacks.list ? M.jacks.list.map(([v, label, sub]) => ({ label, sub, on: activeCh === v, plugOp: activeCh === v ? 1 : 0, pick: () => this.set(fk(M.jacks.key), v) })) : [];
    const jl = M.jacksSide === 'left';
    const G = M.jacks && M.jacks.grid;
    const jumperOn = !!(G && G.jumper && activeCh === G.jumper);
    // Em JUMPER (fig. 1 do manual 1959HW): guitarra em I-High e cabo de I-Low para II-High.
    const plugged = (v) => activeCh === v || (jumperOn && (v === 'high1' || v === 'low1' || v === 'high2'));
    const gjacks = G ? G.list.map(([v, aria, c, r]) => ({ aria, c, r, on: plugged(v), plugOp: plugged(v) ? 1 : 0, pick: () => this.set(fk(M.jacks.key), v) })) : [];
    const gcaps = G ? G.caps.map(([t, c]) => ({ t, c })) : [];
    const jackSide = G ? G.side.map((t) => ({ t })) : [];
    const P0 = { isBat: false, isJewel: false, isRocker: false, isLogo: false, topTxt: '', botTxt: '', aria: '', on: false, top: 0, face: '', glow: 'none', l1: '', l2: '', toggle: null };
    const P = (o) => Object.assign({}, P0, o);
    let powerItems = [];
    if (M.powerStyle === 'toggle') {
      // Alavancas: OFF/STANDBY em cima, ON embaixo (manual 1959HW, itens 1–3).
      powerItems = [
        P({ isBat: true, topTxt: 'OFF', botTxt: 'ON', aria: 'Power', on: mains, top: mains ? 22 : 2, toggle: () => this.set(fk('mains'), !mains) }),
        P({ isBat: true, topTxt: 'STANDBY', botTxt: 'ON', aria: 'Standby', on: !standby, top: standby ? 2 : 22, toggle: () => this.set(fk('standby'), !standby) }),
        P({ isJewel: true, botTxt: 'INDICATOR' })
      ];
    } else if (M.powerStyle === 'rocker') {
      // JCM800 2203: POWER (rocker vermelho iluminado, faz as vezes de lâmpada piloto) e STANDBY (rocker preto).
      const rk = (on) => on ? 'linear-gradient(180deg,#0a0a0a 0%,#2c2c2c 48%,#454545 52%,#1e1e1e 100%)' : 'linear-gradient(180deg,#4a4a4a 0%,#202020 48%,#151515 52%,#060606 100%)';
      powerItems = [
        P({ isRocker: true, botTxt: 'POWER', aria: 'Power', on: mains, toggle: () => this.set(fk('mains'), !mains),
          face: mains ? 'linear-gradient(180deg,#8a0d06 0%,#e2271a 48%,#ff6a4a 52%,#c41a10 100%)' : 'linear-gradient(180deg,#5e0a05 0%,#3c0603 48%,#2a0402 52%,#160201 100%)',
          glow: mains ? '0 0 12px rgba(255,50,25,.85),inset 0 0 6px rgba(255,200,170,.5)' : 'inset 0 1px 0 rgba(255,255,255,.08)' }),
        P({ isRocker: true, botTxt: 'STANDBY', aria: 'Standby', on: !standby, toggle: () => this.set(fk('standby'), !standby), face: rk(!standby), glow: 'inset 0 1px 0 rgba(255,255,255,.1)' })
      ];
      if (M.logo) powerItems.push(P({ isLogo: true, l1: M.logo[0], l2: M.logo[1] }));
    }
    const gainKey = M.groups.reduce((a, g) => a.concat(g.items), []).find((i) => i.key === 'gain' || i.key === 'v_volume');
    const gv = gainKey ? this.get(fk(gainKey.key), gainKey.def) / 10 : 0.5;

    return {
      dir: M.head ? 'column' : 'column-reverse',
      grille: M.grille, piping: SK.piping, title: M.title, sub: M.sub,
      subInk: M.skin === 'fender' ? 'rgba(20,20,20,.6)' : 'rgba(255,240,210,.6)',
      badgeBg: SK.badge, badgeInk: SK.badgeInk, badgeStyle: M.skin === 'fender' ? 'italic' : 'normal', badgeTf: M.skin === 'fender' ? 'rotate(-4deg)' : 'none',
      grilleGlow: live ? (0.06 + 0.16 * gv).toFixed(2) : 0,
      panelBg: SK.panel, panelBorder: SK.border, ink: SK.ink, rule: SK.rule, labelPx: SK.label, chipBg: SK.chipBg, chipInk: SK.chipInk,
      powerLeft: M.power === 'left', powerRight: M.power === 'right',
      jacksLeft: !!M.jacks && !G && jl, jacksRight: !!M.jacks && !G && !jl, jacks, groups,
      powerItems, gridJacks: !!G, jackCols: G ? G.cols : 1, gjacks, gcaps, jackSide,
      hasJumper: !!(G && G.jumper), jumperOn,
      jumperLed: jumperOn ? '#ffb02e' : '#2a2a2a', jumperGlow: jumperOn ? '0 0 6px #ffb02e' : 'none',
      toggleJumper: () => this.set(fk(M.jacks.key), jumperOn ? 'high1' : (G && G.jumper) || activeCh),
      jewelFilter: mains ? 'none' : 'grayscale(1) brightness(.35)',
      mainsOn: mains, standbyOn: standby, mainsTop: mains ? 2 : 22, standbyTop: standby ? 22 : 2,
      toggleMains: () => this.set(fk('mains'), !mains),
      toggleStandby: () => this.set(fk('standby'), !standby)
    };
  }
}
</script>
