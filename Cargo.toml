[workspace]
resolver = "2"
members = [
    "crates/ampforge-dsp",
    "crates/sonix-core",
    "crates/sonix-desktop",
    "crates/sonix-plugin",
    "apps/sonix-app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Ronaldo S. Navarro <navarro.silva@terra.com.br>"]
license = "CC-BY-NC-4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_patterns = "deny"
dead_code = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"

[profile.dev]
opt-level = 1
debug = true
