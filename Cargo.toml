[workspace]
resolver = "2"
members = [
    "crates/ampforge-dsp",
    "crates/sonix-core",
    "crates/sonix-desktop",
    "crates/sonix-plugin",
    "apps/sonix-app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Ronaldo S. Navarro <navarro.silva@terra.com.br>"]
license = "CC-BY-NC-4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
