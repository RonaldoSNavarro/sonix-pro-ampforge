[package]
name = "sonix-plugin"
version = "1.0.0"
edition = "2021"
license.workspace = true

[lib]
name = "sonix_plugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
ampforge-dsp = { path = "../ampforge-dsp" }
sonix-core = { path = "../sonix-core" }
sonix-desktop = { path = "../sonix-desktop", default-features = false }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
