[package]
name = "sonix-desktop"
version = "1.0.0"
edition = "2021"

[dependencies]
ampforge-dsp = { path = "../ampforge-dsp" }
sonix-core = { path = "../sonix-core" }
sonix-plugin = { path = "../sonix-plugin" }
thiserror = "1.0"
cpal = "0.18.2"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["dev-http"]
dev-http = []

