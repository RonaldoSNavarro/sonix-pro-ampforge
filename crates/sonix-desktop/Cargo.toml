[package]
name = "sonix-desktop"
version = "1.0.0"
edition = "2021"
license.workspace = true

[dependencies]
ampforge-dsp = { path = "../ampforge-dsp" }
sonix-core = { path = "../sonix-core" }
thiserror = "1.0"
cpal = { version = "0.18.2", optional = true }
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"
midir = "0.11"

[dev-dependencies]
# COR-11: a bancada_auditoria promove o thread de medição com a mesma função
# que o cpal (feature `realtime`) usa no thread de áudio do WASAPI. Mesma
# versão que o Cargo.lock resolve para o cpal.
audio_thread_priority = { version = "0.35", default-features = false }

[features]
default = ["dev-http", "host-audio"]
dev-http = []
host-audio = ["dep:cpal", "cpal/realtime"]
asio = ["host-audio", "cpal/asio"]
fault-injection = []

[[test]]
name = "contract_013_desktop_realtime_audio"
required-features = ["dev-http"]

[[test]]
name = "contract_014_ui_dsp_bridge"
required-features = ["dev-http"]

[[test]]
name = "contract_015_server_hardening"
required-features = ["dev-http"]

