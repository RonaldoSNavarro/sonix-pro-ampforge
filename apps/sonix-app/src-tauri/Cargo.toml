[package]
name = "sonix-app"
version = "1.0.0"
edition = "2021"
license.workspace = true
description = "SONIX PRO // AMPFORGE Desktop App (Tauri v2)"

[lib]
name = "sonix_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
asio = ["sonix-desktop/asio"]

[dependencies]
sonix-desktop = { path = "../../../crates/sonix-desktop", default-features = false }
ampforge-dsp = { path = "../../../crates/ampforge-dsp" }
sonix-core = { path = "../../../crates/sonix-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
